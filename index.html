      <ul id="blog_posts"></ul>
      <span id="rss-link"><a href="/blog/feed.xml">rss</a></span>
      <script>
        (function () {
          const ul = document.getElementById('blog_posts');
          const esc = s => String(s).replace(/</g, '&lt;');
          const isLocal = ['localhost', '127.0.0.1', ''].includes(location.hostname);
          let allPosts = [];

          function currentFilters() {
            const h = location.hash.slice(1);
            if (!h) return [];
            return h.split(',')
              .map(t => decodeURIComponent(t).toLowerCase())
              .filter(Boolean);
          }
          function setFilters(tags) {
            const uniq = [...new Set(tags)];
            location.hash = uniq.length ? uniq.map(encodeURIComponent).join(',') : '';
            if (!uniq.length && location.hash === '') render();
          }

          function render() {
            const filters = currentFilters();
            const visible = isLocal ? allPosts : allPosts.filter(p => p.status !== 'draft');
            const shown = filters.length
              ? visible.filter(p => {
                  const pt = (p.tags || []).map(t => t.toLowerCase());
                  return filters.every(f => pt.includes(f));
                })
              : visible;

            let banner = '';
            if (filters.length) {
              const tagLinks = filters.map(t =>
                '<a class="tag" href="#" data-remove="' + encodeURIComponent(t) +
                '" title="remove #' + esc(t) + '">#' + esc(t) + '</a>'
              ).join(' ');
              banner = '<li class="filter-active">showing ' + tagLinks +
                ' <a class="tag" href="#" data-clear="1">(clear)</a></li>';
            }

            ul.innerHTML = banner + shown.map(p => {
              const tagHtml = (p.tags || []).map(t =>
                '<a class="tag" href="#" data-add="' + encodeURIComponent(t) +
                '">#' + esc(t) + '</a>'
              ).join(' ');
              const draftBadge = p.status === 'draft' ? ' <span class="draft-badge">(draft)</span>' : '';
              return '<li><time datetime="' + p.date + '">' + p.date + '</time> ' +
                '<a href="./blog/posts/' + p.slug + '/">' + esc(p.title) + '</a>' + draftBadge +
                (tagHtml ? ' ' + tagHtml : '') + '</li>';
            }).join('');
          }

          ul.addEventListener('click', e => {
            const el = e.target.closest('[data-add], [data-remove], [data-clear]');
            if (!el) return;
            e.preventDefault();
            const filters = currentFilters();
            if (el.dataset.clear) {
              setFilters([]);
            } else if (el.dataset.add) {
              const t = decodeURIComponent(el.dataset.add).toLowerCase();
              setFilters([...filters, t]);
            } else if (el.dataset.remove) {
              const t = decodeURIComponent(el.dataset.remove).toLowerCase();
              setFilters(filters.filter(x => x !== t));
            }
          });

          fetch('./blog/posts.json', { cache: 'no-cache' })
            .then(r => r.json())
            .then(posts => { allPosts = posts; render(); })
            .catch(() => {});
          addEventListener('hashchange', render);
        })();
      </script>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>not found — archie</title>
  <meta name="viewport" content="width=device-width, initial-scale=0.7">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <script>
    // GitHub Pages serves this for any missing path. A portfolio item that
    // has no page yet (tagged since the last build, see blog/gallery_pages.py)
    // is /<gallery>/<key>/: send it to /<gallery>/?item=<key>, which opens it.
    (function () {
      var m = location.pathname.match(/^\/([^\/]+)\/([^\/]+)\/?$/);
      if (!m) return;
      document.documentElement.style.visibility = 'hidden';
      fetch('/hpi/gallery/galleries.json').then(function (r) { return r.json(); }).then(function (list) {
        if (!list.some(function (g) { return g.id === m[1]; })) throw 0;
        location.replace('/' + m[1] + '/?item=' + m[2]);
      }).catch(function () { document.documentElement.style.visibility = ''; });
    })();
  </script>
</head>
<body>
  <div id="container">
    <span>nothing here. <a href="/">go home</a></span>
  </div>
</body>
</html>

name: Build set-splitter

# Manual only (Actions tab > Run workflow). The site deploys from main, and
# builds are done locally with `npm run dev` and committed, so an automatic
# run here would push a second build commit and make local pushes fail.
on:
  workflow_dispatch:

permissions:
  contents: write # needed so GITHUB_TOKEN can push the built files back

concurrency:
  group: set-splitter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: _set-splitter/package-lock.json

      - name: Install deps
        working-directory: _set-splitter
        run: npm ci

      - name: Build
        working-directory: _set-splitter
        run: npm run build

      - name: Sync build into projects/set-splitter
        run: |
          rm -rf projects/set-splitter
          mkdir -p projects/set-splitter
          cp -R _set-splitter/dist/. projects/set-splitter/

      - name: Commit if there is a diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/set-splitter
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Build set-splitter [skip ci]"
          git push
